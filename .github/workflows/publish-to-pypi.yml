name: Publish to PyPI

on:
  push:
    branches:
      - master
    paths:
      - pyribbit/version.py

permissions:
  contents: read

jobs:
  check-version:
    if: github.repository == 'fishbotics/pyribbit'
    runs-on: ubuntu-latest
    outputs:
      unpublished: ${{ steps.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whether this version is already published
        id: version
        run: |
          python - <<'PYCODE'
          import os
          import runpy
          import urllib.error
          import urllib.parse
          import urllib.request

          version = runpy.run_path("pyribbit/version.py")["__version__"]
          url = "https://pypi.org/pypi/pyribbit/{}/json".format(
              urllib.parse.quote(version, safe="")
          )
          try:
              with urllib.request.urlopen(url, timeout=30):
                  unpublished = False
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              unpublished = True
          print("Version {}: {}".format(
              version, "ready to publish" if unpublished else "already on PyPI"
          ))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("unpublished={}\n".format(str(unpublished).lower()))
          PYCODE

  build:
    needs: check-version
    if: needs.check-version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install . pytest build twine
      - name: Run non-rendering tests
        run: >-
          python -m pytest --no-gui
          tests/unit/test_viewer.py tests/unit/test_meshes.py
          tests/unit/test_cameras.py tests/unit/test_lights.py
          tests/unit/test_nodes.py tests/unit/test_scenes.py
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
